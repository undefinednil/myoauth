# MyOAuth via Docker Compose.
#
# The container runs as uid:gid 100:101 (non-root, see Dockerfile), so the host
# files it reads/writes must be owned by / writable to 100:101.
#
# The single configuration file is `.env`. The container image ships safe
# defaults (port, /data paths, secure cookies, trust proxy), so `.env` only
# needs the per-deployment values (issuer, admin password, optional forward
# auth). The RSA signing key is auto-generated in /data on first boot.
#
# First run (from the repo root):
#   1. cp .env.example .env            # then edit the values you need
#   2. mkdir -p data
#   3. chown -R 100:101 data           # writable by the container
#   4. docker compose up -d --build
#
# The key is generated in /data (and thus persists across restarts). To use a
# pre-made key instead, mount it and point MYOAUTH_RSA_PRIVATE_KEY_PATH at it
# (e.g. `bash scripts/gen_keys.sh oauth.private.pem` then mount it read-only).
#
# The port is published on loopback only (127.0.0.1:20476), so it is not exposed
# publicly; put a reverse proxy in front for external access.

services:
  myoauth:
    build:
      context: .
      dockerfile: Dockerfile
    image: myoauth:latest
    env_file:
      # Optional: the stack boots with the Docker defaults when `.env` is absent.
      # The long syntax (`required: false`) needs Docker Compose >= 2.24; on
      # older Compose drop this `env_file` block entirely (or upgrade Compose).
      - path: .env
        required: false
    ports:
      # Loopback only: never exposed on a public interface.
      - "127.0.0.1:20476:20476"
    volumes:
      # Persistent SQLite database, log file and auto-generated RSA key.
      - ./data:/data
    restart: unless-stopped
    # NOTE: 20476 is coupled to MYOAUTH_HTTP_ADDRESS; change both together.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:20476/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
