# golangci-lint v2 configuration (schema: https://golangci-lint.run).
#
# CI pins the matching binary: golangci-lint-action with version v2.15.0.
# Reproduce locally with:
#   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
#
# Linters: the "standard" set (errcheck, govet, ineffassign, staticcheck,
# unused). No extra linters are enabled; add them deliberately as the tree
# supports them.
version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      # The explicit "all + ST exclusions" list reproduces golangci-lint's
      # built-in staticcheck defaults; only the pre-existing violations below
      # are additionally disabled. They all live in Go files outside the scope
      # of the ops change that introduced this config, and fixing them here
      # would mean editing those files, so they are excluded (not fixed) with
      # the reasoning recorded. Someone owning those files should remove the
      # exclusions once addressed:
      #   - S1038:   token/jwt.go logs via Println(fmt.Sprintf(...)) (cosmetic).
      #   - QF1008:  redundant embedded-field selectors in token/jwt.go and
      #              util/logger.go (quickfix suggestion, no behavioral impact).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -S1038
        - -QF1008
