# There are two supported deployments of MyOAuth behind nginx:
#
#   1. OIDC provider / relying-party front end (this file): nginx proxies the
#      whole site (issuer + SPA) to MyOAuth, which acts as the identity
#      provider plus hosted login.
#   2. Forward auth (`auth_request`): MyOAuth gates a *separate* application by
#      validating a session cookie and returning identity headers. See
#      `nginx.forward-auth.example.conf` and enable `forwardAuth` in conf.json.
#
# The blocks below are the OIDC provider deployment.

server {
  listen 80;
  server_name auth.example.com;

  location / {
    proxy_pass http://127.0.0.1:20476;
    proxy_set_header Host $host;
    # X-Real-IP overwrites any client-supplied value with the real peer, so the
    # rate limiter can rely on it when `trustProxy` is true in conf.json.
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for appends the peer, so the left-most XFF entry is
    # attacker-controlled; the limiter therefore uses the right-most entry.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name auth-ui.example.com;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }
}
