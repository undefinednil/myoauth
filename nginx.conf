# MyOAuth behind nginx - OIDC provider / SPA front end.
#
# There are two supported deployments of MyOAuth behind nginx:
#
#   1. OIDC provider / relying-party front end (this file): nginx proxies the
#      whole site (issuer + SPA) to MyOAuth, which acts as the identity
#      provider plus hosted login.
#   2. Forward auth (`auth_request`): MyOAuth gates a *separate* application by
#      validating a session cookie and returning identity headers. See
#      `nginx.forward-auth.example.conf` and enable the feature with the
#      MYOAUTH_FORWARD_AUTH_* environment variables (see .env.example).
#
# The SPA is embedded in the Go binary and served through the proxy below, so
# no separate static-vhost (root /usr/share/nginx/html) is needed. The old
# auth-ui.example.com block that did that has been removed because it was
# misleading: the container never shipped those files, and it bypassed the Go
# server (and thus its session/security handling) entirely.
#
# Include this file from the http context (e.g. /etc/nginx/conf.d/), because
# it declares a log_format, which is only valid at http level.

server_tokens off;

# Log the method and the URI *without* the query string ($uri, not $request or
# $request_uri): /authorize?code=... and /logout?id_token_hint=... carry
# credentials in the query string that must not end up in access logs.
log_format myoauth '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status '
                   '$body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time';

server {
  listen 80;
  server_name auth.example.com;

  access_log /var/log/nginx/myoauth.access.log myoauth;

  # Registration and token POSTs are small; cap the body so oversized requests
  # are rejected before they reach MyOAuth.
  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:20476;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # X-Real-IP overwrites any client-supplied value with the real peer, so the
    # rate limiter can rely on it when MYOAUTH_TRUST_PROXY is true.
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for appends the peer, so the left-most XFF entry is
    # attacker-controlled; the limiter therefore uses the right-most entry.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Explicit upstream timeouts: generous but bounded.
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

