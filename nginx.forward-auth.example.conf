# Forward-auth (auth_request) example for MyOAuth.
#
# MyOAuth replaces oauth2-proxy's forward-auth role: nginx makes an internal
# subrequest to /oauth2/auth for every protected request. A 2xx (202) allows the
# request and exposes the identity through X-Auth-Request-* headers; a 401 sends
# the browser into the login flow, which returns to the originally requested URL
# (the `rd` parameter).
#
# Sessions are server-side: the browser only holds an opaque, HttpOnly session
# id cookie. The /oauth2/auth subrequest refreshes an expired access token by
# updating the row in MyOAuth's SQLite database, so no Set-Cookie has to cross
# the auth_request (which nginx would drop anyway).
#
# Enable the feature in conf.json first:
#
#   "forwardAuth": {
#     "enabled": true,
#     "clientId": "proxy",
#     "clientSecret": "<random, e.g. `openssl rand -hex 32`>",
#     "cookieSecret": "<at least 32 chars, e.g. `openssl rand -hex 32`>",
#     "cookieSecure": true
#   }
#
# The proxy's OIDC client (default clientId "proxy") is created automatically on
# startup if it does not exist, so no manual admin setup is required.
#
# HARDENING NOTES
#   * The three identity headers this setup forwards are overwritten with the
#     values nginx received from the auth subrequest, discarding anything the
#     client sent. nginx has no wildcard header strip: a few common extras are
#     blanked below, but you MUST also blank any other X-Auth-Request-* header
#     your upstream trusts. Downstream apps must trust only the documented
#     headers (and prefer X-Auth-Request-User over anything else).
#   * Upstreams MUST authorize on X-Auth-Request-User (the immutable user UUID),
#     never on X-Auth-Request-Preferred-Username (a mutable display name).
#   * /oauth2/auth is `internal`; clients cannot call it directly.
#   * `error_page 401` is scoped to the protected location so it converts BOTH
#     the auth subrequest's 401 and a genuine upstream 401 into the login
#     redirect. Do not place it at server scope or it will also catch 401s from
#     the OIDC endpoints.

upstream myoauth_auth {
  server 127.0.0.1:20476;
}

server {
  listen 80;
  server_name app.example.com;

  # Protected application. `auth_request` gates every request in this location.
  location / {
    auth_request /oauth2/auth;
    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    auth_request_set $auth_username $upstream_http_x_auth_request_preferred_username;
    auth_request_set $auth_access_token $upstream_http_x_auth_request_access_token;

    # Overwrite the identity headers with values nginx received from the auth
    # subrequest, discarding anything the client sent.
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Preferred-Username $auth_username;
    proxy_set_header X-Auth-Request-Access-Token $auth_access_token;

    # Blank a few other X-Auth-Request-* headers a client might try to inject
    # (an empty value makes nginx omit the header). Add one line per extra
    # header your upstream consumes; nginx has no wildcard strip.
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-User-Id "";

    # Standard forwarding headers for the upstream.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://127.0.0.1:8080;

    # Scoped here on purpose: a 401 from the auth subrequest OR from the
    # upstream itself sends the browser into the login flow.
    error_page 401 = @sign_in;
  }

  # Internal subrequest target. It returns 202 (allow) or 401 (deny) and has no
  # body. It is `internal` so clients cannot call it directly. It may refresh
  # and rotate the access token server-side; no cookies need to be propagated.
  location = /oauth2/auth {
    internal;
    proxy_pass http://myoauth_auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # Login / callback / sign-out endpoints are proxied to MyOAuth. Sign-out
  # deletes the server-side session and revokes the session's tokens.
  location /oauth2/ {
    proxy_pass http://myoauth_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A denied (401) request is redirected into the login flow, carrying the
  # original URI as `rd` so the user lands back where they started.
  location @sign_in {
    return 302 /oauth2/start?rd=$request_uri;
  }
}
