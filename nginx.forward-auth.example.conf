# Forward-auth (auth_request) example for MyOAuth.
#
# MyOAuth replaces oauth2-proxy's forward-auth role: nginx makes an internal
# subrequest to /oauth2/auth for every protected request. A 2xx (202) allows the
# request and exposes the identity through X-Auth-Request-* headers; a 401 sends
# the browser into the login flow, which returns to the originally requested URL
# (the `rd` parameter).
#
# HOST-AWARE MODEL (cross-host)
#   The login flow is host-aware: /oauth2/start, /oauth2/callback and the
#   session all live on the PROTECTED APP's own origin, not the issuer's. In
#   this example the app is app.example.com while the issuer is
#   auth.example.com; nginx on the app host proxies /oauth2/ to MyOAuth. The
#   browser therefore only ever talks to app.example.com for the OAuth dance,
#   so the session cookie is host-only and a `__Host-`-prefixed cookieName
#   works with no cookieDomain hack. The `rd` return URL can stay relative
#   (`/oauth2/start?rd=$request_uri`).
#
#   Register the app origin in MyOAuth's allowedCallbackOrigins (see below);
#   /oauth2/start refuses (400) any request origin that is not listed, so a
#   spoofed Host/X-Forwarded-Host cannot cause an open redirect.
#
#   nginx MUST forward the app host and scheme to MyOAuth. Origin derivation
#   prefers `X-Forwarded-Host` over `Host`, so the `/oauth2/` location below
#   sets all three (`Host`, `X-Forwarded-Host` and `X-Forwarded-Proto`), which
#   is what makes the derived origin deterministic and match
#   allowedCallbackOrigins. Setting X-Forwarded-Host explicitly (rather than
#   letting a client-supplied one through) means a client cannot inject it.
#
# Sessions are server-side: the browser only holds an opaque, HttpOnly session
# id cookie. The /oauth2/auth subrequest refreshes an expired access token by
# updating the row in MyOAuth's SQLite database, so no Set-Cookie has to cross
# the auth_request (which nginx would drop anyway).
#
# Enable the feature with the MYOAUTH_FORWARD_AUTH_* environment variables (in
# `.env`), for example:
#
#   MYOAUTH_FORWARD_AUTH_ENABLED=true
#   MYOAUTH_FORWARD_AUTH_CLIENT_ID=proxy
#   MYOAUTH_FORWARD_AUTH_CLIENT_SECRET=<random, e.g. `openssl rand -hex 32`>
#   MYOAUTH_FORWARD_AUTH_COOKIE_SECRET=<at least 32 chars, e.g. `openssl rand -hex 32`>
#   MYOAUTH_FORWARD_AUTH_COOKIE_SECURE=true
#   MYOAUTH_FORWARD_AUTH_ALLOWED_CALLBACK_ORIGINS=https://app.example.com
#
# The proxy's OIDC client (default clientId "proxy") is created automatically on
# startup if it does not exist, and its allowed redirects are kept in sync with
# allowedCallbackOrigins (manually-added redirects are preserved).
#
# HARDENING NOTES
#   * The three identity headers this setup forwards are overwritten with the
#     values nginx received from the auth subrequest, discarding anything the
#     client sent. nginx has no wildcard header strip: a few common extras are
#     blanked below, but you MUST also blank any other X-Auth-Request-* header
#     your upstream trusts. Downstream apps must trust only the documented
#     headers (and prefer X-Auth-Request-User over anything else).
#   * Upstreams MUST authorize on X-Auth-Request-User (the immutable user UUID),
#     never on X-Auth-Request-Preferred-Username (a mutable display name).
#   * /oauth2/auth is `internal`; clients cannot call it directly.
#   * `error_page 401` is scoped to the protected location so it converts BOTH
#     the auth subrequest's 401 and a genuine upstream 401 into the login
#     redirect. Do not place it at server scope or it will also catch 401s from
#     the OIDC endpoints.

upstream myoauth_auth {
  server 127.0.0.1:20476;
}

server {
  # HTTPS: the rest of this example assumes TLS (`cookieSecure: true` and an
  # `https://` allowedCallbackOrigins entry). Either terminate TLS here with
  # the certificate lines below, or delete them when an upstream (Cloudflare,
  # an existing vhost, ...) already terminates TLS and forwards plain HTTP to
  # this server block.
  listen 443 ssl;
  # listen [::]:443 ssl;
  server_name app.example.com;

  ssl_certificate     /etc/nginx/certs/app.example.com.crt;
  ssl_certificate_key /etc/nginx/certs/app.example.com.key;

  # Protected application. `auth_request` gates every request in this location.
  location / {
    auth_request /oauth2/auth;
    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    auth_request_set $auth_username $upstream_http_x_auth_request_preferred_username;
    auth_request_set $auth_access_token $upstream_http_x_auth_request_access_token;

    # Overwrite the identity headers with values nginx received from the auth
    # subrequest, discarding anything the client sent.
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Preferred-Username $auth_username;
    proxy_set_header X-Auth-Request-Access-Token $auth_access_token;

    # Blank a few other X-Auth-Request-* headers a client might try to inject
    # (an empty value makes nginx omit the header). Add one line per extra
    # header your upstream consumes; nginx has no wildcard strip.
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-User-Id "";

    # Standard forwarding headers for the upstream. X-Forwarded-Host is pinned
    # to $host (not passed through from the client) so the upstream sees the
    # same deterministic origin the /oauth2/ endpoints derive.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_pass http://127.0.0.1:8080;

    # Scoped here on purpose: a 401 from the auth subrequest OR from the
    # upstream itself sends the browser into the login flow.
    error_page 401 = @sign_in;
  }

  # Internal subrequest target. It returns 202 (allow) or 401 (deny) and has no
  # body. It is `internal` so clients cannot call it directly. It may refresh
  # and rotate the access token server-side; no cookies need to be propagated.
  location = /oauth2/auth {
    internal;
    proxy_pass http://myoauth_auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # Login / callback / sign-out endpoints are proxied to MyOAuth. They run on
  # THIS origin (app.example.com): /oauth2/start issues the authorize redirect,
  # /oauth2/callback lands back here and sets a host-only session cookie, and
  # /oauth2/sign_out deletes the server-side session and revokes its tokens.
  # MyOAuth derives the app origin preferring `X-Forwarded-Host` (falling back
  # to `Host`) plus `X-Forwarded-Proto`, then matches it against
  # allowedCallbackOrigins. All three are set explicitly here so the origin is
  # deterministic AND a client-supplied X-Forwarded-Host can never reach MyOAuth.
  location /oauth2/ {
    proxy_pass http://myoauth_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # A denied (401) request is redirected into the login flow. `rd` is a relative
  # URI because the whole flow stays on this origin, so the user lands back
  # where they started.
  location @sign_in {
    return 302 /oauth2/start?rd=$request_uri;
  }
}
